<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kai Agent - Model Trigger Button Fit & Hover Scroll Demo</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <h2 class="mockup-title">Model Selector Button Fit & Hover Scroll Demo</h2>
    <p class="mockup-description">The trigger button fits the model name length (left-aligned). For long names, it expands up to max-width, clips with a fade mask, and scrolls on hover.</p>

    <div class="demo-card" style="width: 340px;">
        <!-- Simulated Toolbar Row 1: Short Model Name -->
        <h3 style="font-size: 0.75rem; color: var(--app-muted); margin: 0 0 6px 0;">1. Short Model Name (Fitted to content)</h3>
        <div class="input-toolbar-demo">
            <div class="toolbar-left">
                <div class="custom-dropdown">
                    <button type="button" class="dropdown-trigger" title="Active Model">
                        <span class="status-dot status-connected"></span>
                        <div class="model-text-container">
                            <span class="model-text-inner">Gemini 2.5 Flash</span>
                        </div>
                        <svg class="dropdown-trigger-chevron" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                </div>
            </div>
            <button class="send-btn-demo" type="button">➔</button>
        </div>

        <!-- Simulated Toolbar Row 2: Long Model Name -->
        <h3 style="font-size: 0.75rem; color: var(--app-muted); margin: 16px 0 6px 0;">2. Long Model Name (Max-width clipped & hover scrolls)</h3>
        <div class="input-toolbar-demo">
            <div class="toolbar-left">
                <div class="custom-dropdown">
                    <button type="button" class="dropdown-trigger" title="Active Model">
                        <span class="status-dot status-connected"></span>
                        <div class="model-text-container">
                            <span class="model-text-inner">deepseek-ai/DeepSeek-R1-Distill-Qwen-32B@q4_k_m</span>
                        </div>
                        <svg class="dropdown-trigger-chevron" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                </div>
            </div>
            <button class="send-btn-demo" type="button">➔</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
