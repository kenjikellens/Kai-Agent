<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAI Agent</title>
    <link rel="icon" type="image/svg+xml" href="media/svg/kai_icon.svg">
    <link rel="alternate icon" type="image/png" href="media/svg/kai_icon.png">
    <link href="media/codicons/codicon.css" rel="stylesheet" />
    <link href="media/main.css" rel="stylesheet" />
</head>
<body>
    <div class="app-layout" id="app-layout">
        <!-- Modern Collapsible Left Sidebar (ChatGPT/Gemini Style) -->
        <aside class="app-sidebar" id="app-sidebar">
            <!-- Sidebar Top Header Controls -->
            <div class="sidebar-top">
                <!-- Collapse / Expand Sidebar Toggle Button (HELEMAAL vanboven) -->
                <div class="sidebar-toggle-row">
                    <button type="button" class="sidebar-icon-btn" id="sidebar-toggle-btn" title="Toggle Sidebar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="3" x2="9" y2="21"></line>
                        </svg>
                    </button>
                </div>

                <!-- New Chat Button (Onder de sidebar toggle met zelfde styling) -->
                <button type="button" class="sidebar-action-btn" id="new-chat-btn" title="New Chat" data-i18n-title="newChat">
                    <svg class="sidebar-btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span class="btn-label" data-i18n="newChat">New Chat</span>
                </button>

                <!-- Active Workspace Directory Selector Badge -->
                <button type="button" class="sidebar-action-btn workspace-badge" id="workspace-badge-btn" title="Click to Change Workspace Directory">
                    <svg class="sidebar-btn-icon workspace-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="workspace-name btn-label" id="active-workspace-name">Select Workspace...</span>
                </button>
            </div>

            <!-- Scrollable Chats History List in Left Sidebar -->
            <div class="sidebar-history-section">
                <div class="sidebar-section-title" data-i18n="previousChats">Chats</div>
                <div id="history-list" class="sidebar-history-list"></div>
            </div>

            <!-- Sidebar Bottom Footer with Settings -->
            <div class="sidebar-footer">
                <button type="button" class="sidebar-footer-btn" id="settings-btn" title="Settings" data-i18n-title="settings">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82-.33l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span class="btn-label" data-i18n="settings">Settings</span>
                </button>
            </div>
        </aside>

        <!-- Main Content Area (Right Side) -->
        <main class="app-main-content">
            <!-- View A: Active Chat View (Default) -->
            <div id="chat-view" class="content-view">
                <!-- Chat Output Area (Centered column) -->
                <div id="chat-container" class="chat-container"></div>

                <!-- Chat Input Area (Centered floating dock) -->
                <div class="input-panel">
                    <div class="input-card">
                        <div id="attached-files-bar" class="attached-files-bar hidden"></div>
                        <textarea id="message-input" placeholder="Ask Kai or describe a task..." rows="1"></textarea>
                        <div class="input-toolbar">
                            <div class="toolbar-left">
                                <!-- File Upload Attachment Button -->
                                <button type="button" class="toolbar-icon-btn" id="attach-file-btn" title="Attach Files">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                </button>

                                <!-- Model Selector Dropdown -->
                                <div class="custom-dropdown" id="model-dropdown-container">
                                    <button type="button" class="dropdown-trigger" id="dropdown-trigger-btn" title="Active Model">
                                        <span id="status-dot" class="status-dot status-disconnected"></span>
                                        <div id="selected-model-text-container" class="model-text-container">
                                            <span id="selected-model-text" class="model-text-inner">Select Model</span>
                                        </div>
                                        <svg class="dropdown-trigger-chevron" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                    </button>
                                    <div class="dropdown-menu hidden" id="dropdown-options-menu"></div>
                                </div>
                            </div>
                            <div class="toolbar-right">
                                <!-- Context & Capabilities Dropdown ("@" Button) -->
                                <div class="custom-dropdown" id="context-options-dropdown-container">
                                    <button type="button" class="toolbar-icon-btn" id="at-mention-trigger-btn" title="Capabilities & Mentions (@)">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path></svg>
                                    </button>
                                    <div class="dropdown-menu hidden" id="context-options-menu">
                                        <div class="context-options-header">
                                            <span>Capabilities</span>
                                        </div>
                                        <div class="context-option-row" id="planning-mode-option-row"></div>
                                    </div>
                                </div>
                                <button id="send-btn" title="Send message">
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- View B: Settings View Panel -->
            <div id="settings-container" class="content-view settings-container hidden">
                <div class="settings-scroll-wrapper">
                    <div class="settings-panel-header">
                        <div class="settings-header-titles">
                            <h2 class="settings-title" data-i18n="settings">Settings</h2>
                        </div>
                        <button id="close-settings-btn" class="icon-btn-header" title="Close Settings">✕</button>
                    </div>

                    <div class="settings-content-panel">
                        <!-- Section 1: General Preferences -->
                        <div class="settings-section" id="category-general">
                            <div class="settings-section-header">
                                <span class="settings-section-title" data-i18n="generalSettings">General Settings</span>
                            </div>
                            <div class="settings-section-body">
                                <div class="setting-row">
                                    <div class="setting-info">
                                        <span class="setting-label" data-i18n="language">Language</span>
                                    </div>
                                    <div class="setting-control" id="language-select-container"></div>
                                </div>
                                <div class="setting-row">
                                    <div class="setting-info">
                                        <span class="setting-label">UI Scale</span>
                                    </div>
                                    <div class="setting-control" id="ui-scale-select-container"></div>
                                </div>
                            </div>
                        </div>

                        <!-- Section 2: Local AI (LM Studio) -->
                        <div class="settings-section" id="category-lmstudio">
                            <div class="settings-section-header">
                                <span class="settings-section-title" data-i18n="lmStudioHeader">LM Studio</span>
                            </div>
                            <div class="settings-section-body">
                                <div class="setting-row">
                                    <div class="setting-info">
                                        <span class="setting-label" data-i18n="serverUrl">Server URL</span>
                                    </div>
                                    <div class="setting-control">
                                        <input type="text" id="settings-server-url" class="setting-input-text" placeholder="http://localhost:1234/v1" />
                                    </div>
                                </div>
                                <div class="setting-row">
                                    <div class="setting-info">
                                        <span class="setting-label" data-i18n="lmStudioDirectory">LM Studio Directory</span>
                                    </div>
                                    <div class="setting-control setting-control-stacked">
                                        <div class="input-with-action">
                                            <input type="text" id="settings-lmstudio-path" class="setting-input-text" placeholder="Auto-detected (~/.cache/lm-studio)" />
                                            <button type="button" id="browse-lmstudio-path-btn" class="setting-action-btn" data-i18n="browse">Browse...</button>
                                        </div>
                                        <div id="lmstudio-cache-status-indicator" class="cache-status-indicator">
                                            <span id="cache-status-dot" class="status-dot status-disconnected"></span>
                                            <span id="cache-status-text" class="cache-status-label" data-i18n="checkingCache">Checking cache...</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Section 3: Cloud AI & API Keys -->
                        <div class="settings-section" id="category-apikeys">
                            <div class="settings-section-header">
                                <span class="settings-section-title" data-i18n="apiKeysSettings">API Keys & Providers</span>
                            </div>
                            <div class="settings-section-body">
                                <div class="setting-row">
                                    <div class="setting-info">
                                        <span class="setting-label" data-i18n="geminiApiKey">Google Gemini API Key</span>
                                    </div>
                                    <div class="setting-control">
                                        <div class="password-input-wrapper">
                                            <input type="password" id="settings-gemini-key" class="setting-input-text" placeholder="AIzaSy..." />
                                            <button type="button" class="toggle-password-btn" data-target="settings-gemini-key" title="Show/Hide">👁</button>
                                        </div>
                                    </div>
                                </div>
                                <div id="free-providers-keys-list" class="free-providers-keys-list"></div>
                            </div>
                        </div>

                        <!-- Section 4: Reasoning & Thinking -->
                        <div class="settings-section" id="category-thinking">
                            <div class="settings-section-header">
                                <span class="settings-section-title" data-i18n="thinkingSettings">Thinking & Reasoning</span>
                            </div>
                            <div class="settings-section-body">
                                <div class="setting-row" id="show-thinking-setting-row"></div>
                                <div class="setting-row" id="keep-thinking-generating-setting-row"></div>
                                <div class="setting-row" id="keep-thinking-finished-setting-row"></div>
                                <div class="setting-row">
                                    <div class="setting-info">
                                        <span class="setting-label" data-i18n="thinkingDisplayStyle">Thinking Display Format</span>
                                    </div>
                                    <div class="setting-control" id="thinking-style-select-container"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Runtime Environment Bridge Setup -->
    <script>
        // Apply saved UI Scale immediately on load (defaults to 1.0)
        try {
            const savedScale = localStorage.getItem('kai.uiScale') || '1.0';
            document.documentElement.style.zoom = savedScale;
        } catch (e) {}

        window.KAI_SVGS = window.KAI_SVGS || {};
        window.KAI_I18N = window.KAI_I18N || {};
        window.KAI_LANG = window.KAI_LANG || "auto";
        window.KAI_SUPPORTED_LANGUAGES = [
            { value: "auto", label: "Auto (System)" },
            { value: "en", label: "English" },
            { value: "nl", label: "Nederlands" },
            { value: "de", label: "Deutsch" },
            { value: "fr", label: "Français" },
            { value: "es", label: "Español" },
            { value: "zh", label: "中文 (简体)" },
            { value: "zh-tw", label: "中文 (繁體)" },
            { value: "pt", label: "Português" },
            { value: "ja", label: "日本語" },
            { value: "ko", label: "한국어" },
            { value: "ru", label: "Русский" },
            { value: "it", label: "Italiano" },
            { value: "pl", label: "Polski" },
            { value: "tr", label: "Türkçe" },
            { value: "cs", label: "Čeština" },
            { value: "hu", label: "Magyar" },
            { value: "ar", label: "العربية" },
            { value: "hi", label: "हिन्दी" }
        ];

        // Workspace Selector Click Handler
        document.addEventListener('DOMContentLoaded', () => {
            const wsBtn = document.getElementById('workspace-badge-btn');
            if (wsBtn) {
                wsBtn.addEventListener('click', () => {
                    if (window.electronAPI) {
                        window.electronAPI.postMessage({ type: 'browseWorkspaceFolder' });
                    }
                });
            }
        });
    </script>

    <!-- Load Modular Client Scripts -->
    <script src="media/js/AllLocales.js?v=10"></script>
    <script src="media/js/Constants.js?v=10"></script>
    <script src="media/js/DOMUtils.js?v=10"></script>
    <script src="media/js/AppState.js?v=10"></script>
    <script src="media/js/MarkdownFormatter.js?v=10"></script>
    <script src="media/js/WebviewIPCBridge.js?v=10"></script>
    <script src="media/js/FileSummaryWidget.js?v=10"></script>
    <script src="media/js/ToggleComponent.js?v=10"></script>
    <script src="media/js/CustomSelectComponent.js?v=10"></script>
    <script src="media/js/ThinkingStateFormatter.js?v=10"></script>
    <script src="media/js/ModelDropdownController.js?v=10"></script>
    <script src="media/js/SettingsController.js?v=10"></script>
    <script src="media/js/HistoryManager.js?v=10"></script>
    <script src="media/js/FileUploadController.js?v=10"></script>
    <script src="media/js/HelpModalController.js?v=10"></script>
    <script src="media/js/ChatUIController.js?v=10"></script>
    <script src="media/main.js?v=10"></script>

    <!-- Dynamic Connection Status Handler -->
    <script>
        const handleDynamicStatus = (msg) => {
            if (msg && msg.type === 'connectionStatus') {
                if (msg.svgs) {
                    window.KAI_SVGS = { ...window.KAI_SVGS, ...msg.svgs };
                }
                if (msg.translations) {
                    window.KAI_I18N = msg.translations;
                }
                if (msg.workspaceName) {
                    const el = document.getElementById('active-workspace-name');
                    if (el) el.textContent = msg.workspaceName;
                }
                if (msg.workspacePath) {
                    const wsBtn = document.getElementById('workspace-badge-btn');
                    if (wsBtn) wsBtn.title = `Active Workspace: ${msg.workspacePath} (Click to change)`;
                }
            }
        };

        if (window.electronAPI) {
            window.electronAPI.onMessage(handleDynamicStatus);
        }
    </script>
</body>
</html>
